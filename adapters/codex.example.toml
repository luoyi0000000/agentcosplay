# Replace the project path; this is an example, not installed configuration.
# Windows accepts forward slashes, e.g. C:/Projects/character-runtime.
[mcp_servers.character_runtime]
command = "uv"
args = ["--directory", "/absolute/path/to/character-runtime", "run", "--locked", "python", "-m", "character_runtime", "serve", "--transport", "stdio"]
env = { CHARACTER_OWNER = "local-user", CHARACTER_DATA_DIR = "/absolute/path/to/private-character-data" }

# After an approved remote deployment, replace the entry above with:
# [mcp_servers.character_runtime]
# url = "https://your-authorized-service.example/mcp"
# auth = "oauth"
