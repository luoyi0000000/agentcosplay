[build-system]
requires = ["hatchling==1.32.3"]
build-backend = "hatchling.build"

[project]
name = "agentcosplay-host"
version = "2.0.0"
description = "Host protocol SDK and native bindings; uses Host-provided dependencies"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["agentcosplay_host"]

[tool.hatch.build.targets.sdist]
include = ["agentcosplay_host", "pyproject.toml", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = [".", "runtime"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true
mypy_path = ["runtime", "."]
